spring:
  application:
    name: taskflow-auth-service
  profiles:
    active: dev

app:
  jwt:
    # DEV-ONLY DEFAULT. Never rely on this literal value outside local
    # dev — override with the JWT_SECRET env var everywhere else. HS256
    # requires a key of at least 256 bits (32 bytes); this default is
    # comfortably longer than that.
    secret: ${JWT_SECRET:dev-only-secret-please-override-CHANGE-ME-1234567890}
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000   # 7 days
  security:
    lockout:
      # Day 10: 5 failed attempts locks the account for 15 minutes. Both
      # tunable per-environment without a code change — see LockoutProperties.
      max-failed-attempts: 5
      lockout-duration-minutes: 15
    rate-limit:
      # Day 11: 20 requests per 60-second window, per (IP, path), on
      # /auth/login and /auth/register only. Chosen generously enough
      # that working through this README's own test sequence in one
      # sitting doesn't trip it by accident — a real deployment would
      # likely tune this stricter. See RateLimitingFilter.
      capacity: 20
      refill-duration-seconds: 60

---
# ------------------------------------------------------------------
# dev profile
# Postgres runs in Docker (see docker-compose.yml) mapped to host
# port 5433, NOT the Postgres default 5432 — that's deliberate,
# since a local Postgres instance may already be running on 5432.
# ------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/taskflow
    username: taskflow
    password: taskflow_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    # Without this, Spring Boot runs data.sql BEFORE Hibernate creates
    # the schema on first boot, and the seed insert fails with "relation
    # users does not exist". Deferring it until after schema generation
    # is what makes data.sql usable alongside ddl-auto at all.
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

server:
  port: 8080
